<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neat Pulse - Default Framing Mode Controller</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --accent: #0ea5e9;
      --purple: #a855f7;
      --success: #10b981;
      --danger: #ef4444;
      --radius: 8px;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
    }
    
    body { 
      background-color: var(--bg-color); 
      color: var(--text-main); 
      padding: 24px; 
      display: flex; 
      justify-content: center; 
    }

    .container { 
      max-width: 900px; 
      width: 100%; 
      display: flex; 
      flex-direction: column; 
      gap: 24px; 
    }

    header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      padding-bottom: 16px; 
      border-bottom: 1px solid var(--card-border); 
    }

    header h1 { 
      font-size: 1.5rem; 
      color: #fff; 
    }

    .badge { 
      background-color: #334155; 
      padding: 4px 12px; 
      border-radius: 9999px; 
      font-size: 0.85rem; 
      display: flex; 
      align-items: center; 
      gap: 8px; 
    }

    .dot { 
      width: 8px; 
      height: 8px; 
      border-radius: 50%; 
      background-color: var(--text-muted); 
    }
    .dot.connected { background-color: var(--success); }

    .card { 
      background-color: var(--card-bg); 
      border: 1px solid var(--card-border); 
      border-radius: var(--radius); 
      padding: 20px; 
    }

    .card h2 { 
      font-size: 1.1rem; 
      margin-bottom: 16px; 
      color: var(--accent); 
    }

    .form-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); 
      gap: 16px; 
      margin-bottom: 16px; 
    }

    .form-group { 
      display: flex; 
      flex-direction: column; 
      gap: 6px; 
    }

    label { 
      font-size: 0.85rem; 
      color: var(--text-muted); 
    }

    input, select { 
      background-color: #0f172a; 
      border: 1px solid var(--card-border); 
      color: var(--text-main); 
      padding: 10px 12px; 
      border-radius: 6px; 
      font-size: 0.95rem; 
      outline: none; 
    }

    input:focus, select:focus { 
      border-color: var(--accent); 
    }

    .checkbox-group { 
      display: flex; 
      align-items: center; 
      gap: 8px; 
      margin-top: 8px; 
      font-size: 0.85rem; 
      color: var(--text-muted); 
    }

    .checkbox-group input { 
      width: auto; 
      cursor: pointer; 
    }

    .btn { 
      background-color: var(--primary); 
      color: #fff; 
      border: none; 
      padding: 10px 18px; 
      border-radius: 6px; 
      font-weight: 500; 
      cursor: pointer; 
      transition: background-color 0.2s; 
    }

    .btn:hover { background-color: var(--primary-hover); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .framing-options { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); 
      gap: 16px; 
      margin: 16px 0; 
    }

    .framing-card { 
      background: #0f172a; 
      border: 2px solid var(--card-border); 
      border-radius: var(--radius); 
      padding: 16px; 
      cursor: pointer;
